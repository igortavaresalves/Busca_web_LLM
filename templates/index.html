<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Busca IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & Tokens ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0f14;
      --bg-2:        #13161e;
      --bg-3:        #1b1f2b;
      --border:      #252a38;
      --border-2:    #2e3447;
      --text:        #e8eaf2;
      --text-muted:  #6b7280;
      --text-dim:    #9ca3af;
      --accent:      #6c8ef7;
      --accent-glow: rgba(108,142,247,.18);
      --accent-2:    #4ade80;
      --danger:      #f87171;
      --card-hover:  #1e2233;
      --radius:      12px;
      --radius-sm:   8px;
      --radius-xs:   6px;
      --font:        'Sora', sans-serif;
      --mono:        'JetBrains Mono', monospace;
      --shadow:      0 4px 24px rgba(0,0,0,.4);
      --shadow-sm:   0 2px 8px rgba(0,0,0,.3);
      --transition:  .2s cubic-bezier(.4,0,.2,1);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ─────────────────────────────────────────────────── */
    .app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: -.3px;
    }

    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: var(--radius-xs);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .toggle-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 99px;
      border: 1px solid var(--border-2);
      background: var(--bg-2);
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .toggle-btn:hover { background: var(--bg-3); border-color: var(--accent); color: var(--text); }

    .toggle-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--danger);
      transition: var(--transition);
      flex-shrink: 0;
    }

    .toggle-dot.on { background: var(--accent-2); box-shadow: 0 0 6px var(--accent-2); }

    /* ── Chat history ────────────────────────────────────────────── */
    #chat-history {
      flex: 1;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 60px 0;
    }

    .empty-state .icon { font-size: 40px; opacity: .6; }
    .empty-state h2 { font-size: 1.25rem; font-weight: 600; color: var(--text-dim); }
    .empty-state p { font-size: .875rem; max-width: 320px; }

    /* ── Message bubble ──────────────────────────────────────────── */
    .msg-block { display: flex; flex-direction: column; gap: 16px; }

    .msg-user {
      align-self: flex-end;
      max-width: 75%;
      background: var(--bg-3);
      border: 1px solid var(--border-2);
      border-radius: var(--radius) var(--radius) 4px var(--radius);
      padding: 12px 16px;
      font-size: .9375rem;
      font-weight: 500;
      color: var(--text);
    }

    .msg-ai {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ai-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
    }

    .ai-label::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* ── Sources strip ───────────────────────────────────────────── */
    .sources-label {
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .sources-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .source-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text-dim);
      font-size: .8125rem;
      transition: var(--transition);
      max-width: 220px;
      overflow: hidden;
    }

    .source-card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      color: var(--text);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .source-card img {
      width: 16px; height: 16px;
      border-radius: 4px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .source-card-inner {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      gap: 1px;
    }

    .source-title {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: .8rem;
      color: var(--text);
    }

    .source-domain {
      font-size: .72rem;
      color: var(--text-muted);
    }

    .source-num {
      font-size: .68rem;
      font-family: var(--mono);
      background: var(--bg-3);
      border: 1px solid var(--border-2);
      color: var(--accent);
      border-radius: 4px;
      padding: 1px 5px;
      flex-shrink: 0;
    }

    /* ── Answer text (Markdown rendered) ────────────────────────── */
    .answer-text {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      line-height: 1.75;
      color: var(--text);
    }

    .answer-text p { margin-bottom: .75em; }
    .answer-text p:last-child { margin-bottom: 0; }

    .answer-text strong { color: var(--text); font-weight: 600; }

    .answer-text ul, .answer-text ol {
      padding-left: 1.4em;
      margin-bottom: .75em;
    }

    .answer-text li { margin-bottom: .25em; }

    .answer-text h1, .answer-text h2, .answer-text h3 {
      font-weight: 600;
      margin: 1em 0 .4em;
      color: var(--text);
    }

    .answer-text h1 { font-size: 1.2rem; }
    .answer-text h2 { font-size: 1.05rem; }
    .answer-text h3 { font-size: .975rem; }

    .answer-text code {
      font-family: var(--mono);
      font-size: .85em;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      color: #a5f3fc;
    }

    .answer-text pre {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      overflow-x: auto;
      margin: .75em 0;
    }

    .answer-text pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: .85rem;
    }

    /* Citações inline [web:N] */
    .answer-text .cite {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: .68rem;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid rgba(108,142,247,.3);
      border-radius: 4px;
      padding: 1px 5px;
      vertical-align: middle;
      line-height: 1.4;
      cursor: default;
      transition: var(--transition);
    }

    .answer-text .cite:hover {
      background: var(--accent);
      color: #fff;
    }

    /* Cursor piscante durante streaming */
    .streaming-cursor::after {
      content: '▋';
      animation: blink .8s steps(1) infinite;
      color: var(--accent);
    }

    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    /* ── Loading spinner ─────────────────────────────────────────── */
    .loading-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: .875rem;
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border-2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Input area ──────────────────────────────────────────────── */
    .input-wrap {
      position: sticky;
      bottom: 0;
      padding: 16px 0 20px;
      background: linear-gradient(to bottom, transparent, var(--bg) 30%);
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--bg-2);
      border: 1px solid var(--border-2);
      border-radius: var(--radius);
      padding: 10px 10px 10px 16px;
      transition: var(--transition);
    }

    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #question-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-family: var(--font);
      font-size: .9375rem;
      line-height: 1.55;
      max-height: 160px;
      min-height: 24px;
    }

    #question-input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 36px; height: 36px;
      border-radius: var(--radius-xs);
      border: none;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    #send-btn:hover { background: #5a7ef5; transform: scale(1.05); }
    #send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    #send-btn svg { width: 16px; height: 16px; }

    .input-hint {
      margin-top: 6px;
      font-size: .75rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* ── Responsivo ─────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .logo span { display: none; }
      .msg-user { max-width: 90%; }
      .source-card { max-width: 160px; }
      .answer-text { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">🔍</div>
      <span>Busca IA</span>
    </div>

    <div style="display:flex;gap:8px;align-items:center;">
      <button class="toggle-btn" id="toggle-btn" onclick="toggleWeb()">
        <span class="toggle-dot {{ 'on' if web_enabled else '' }}" id="toggle-dot"></span>
        <span id="toggle-label">Busca Web {{ 'ON' if web_enabled else 'OFF' }}</span>
      </button>
      <button class="toggle-btn" id="whitelist-btn" onclick="toggleWhitelist()" title="Restringir a fontes confiáveis (Globo, Folha, ESPN...)">
        <span class="toggle-dot {{ 'on' if whitelist_enabled else '' }}" id="whitelist-dot"></span>
        <span id="whitelist-label">🛡 Whitelist {{ 'ON' if whitelist_enabled else 'OFF' }}</span>
      </button>
    </div>
  </header>

  <!-- Chat history -->
  <div id="chat-history">
    <div class="empty-state" id="empty-state">
      <div class="icon">✦</div>
      <h2>Pergunte qualquer coisa</h2>
      <p>Pesquiso na web em tempo real e sintetizo a resposta com citações.</p>
    </div>
  </div>

  <!-- Input area -->
  <div class="input-wrap">
    <div class="input-box">
      <textarea
        id="question-input"
        rows="1"
        placeholder="Faça uma pergunta…"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <p class="input-hint">Enter para enviar · Shift+Enter para quebrar linha</p>
  </div>

</div>

<script>
  /* ── Estado ────────────────────────────────────────────────── */
  let webEnabled = {{ 'true' if web_enabled else 'false' }};
  let whitelistEnabled = {{ 'true' if whitelist_enabled else 'false' }};
  let isStreaming = false;

  /* ── Auto-resize textarea ──────────────────────────────────── */
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }

  /* ── Enter key handler ─────────────────────────────────────── */
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  /* ── Toggle busca web ──────────────────────────────────────── */
  async function toggleWeb() {
    const btn = document.getElementById('toggle-btn');
    btn.disabled = true;
    try {
      const res = await fetch('/toggle_web', { method: 'POST' });
      const data = await res.json();
      webEnabled = data.web_search;
      document.getElementById('toggle-dot').className = 'toggle-dot' + (webEnabled ? ' on' : '');
      document.getElementById('toggle-label').textContent = `Busca Web ${webEnabled ? 'ON' : 'OFF'}`;
    } catch (e) {
      console.error(e);
    } finally {
      btn.disabled = false;
    }
  }

  /* ── Toggle whitelist ─────────────────────────────────────── */
  async function toggleWhitelist() {
    const btn = document.getElementById('whitelist-btn');
    btn.disabled = true;
    try {
      const res = await fetch('/toggle_whitelist', { method: 'POST' });
      const data = await res.json();
      whitelistEnabled = data.whitelist;
      document.getElementById('whitelist-dot').className = 'toggle-dot' + (whitelistEnabled ? ' on' : '');
      document.getElementById('whitelist-label').textContent = `🛡 Whitelist ${whitelistEnabled ? 'ON' : 'OFF'}`;
    } catch (e) {
      console.error(e);
    } finally {
      btn.disabled = false;
    }
  }

  /* ── Renderiza Markdown simples ────────────────────────────── */
  function renderMarkdown(raw) {
    let html = raw
      // Citações inline [web:N]
      .replace(/\[web:(\d+)\]/g, '<span class="cite" title="Fonte $1">[web:$1]</span>')
      // Blocos de código
      .replace(/```[\w]*\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
      // Código inline
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      // Bold
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      // Itálico
      .replace(/_(.+?)_/g, '<em>$1</em>')
      // Cabeçalhos
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      // Listas não ordenadas
      .replace(/^[-*] (.+)$/gm, '<li>$1</li>')
      // Listas ordenadas
      .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
      // Parágrafos (linhas duplas)
      .replace(/\n\n+/g, '</p><p>')
      // Line breaks simples
      .replace(/\n/g, '<br/>');

    // Envolve em <p> e agrupa <li>
    html = '<p>' + html + '</p>';
    html = html.replace(/(<li>[\s\S]+?<\/li>)/g, '<ul>$1</ul>');
    html = html.replace(/<\/ul>\s*<ul>/g, '');

    return html;
  }

  /* ── Cria cards de fonte ───────────────────────────────────── */
  function renderSources(sources) {
    if (!sources || sources.length === 0) return '';

    const cards = sources.map(s => `
      <a href="${s.url}" target="_blank" rel="noopener" class="source-card" title="${s.snippet}">
        <span class="source-num">${s.id}</span>
        <img src="${s.icon}" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2212%22 font-size=%2212%22>🌐</text></svg>'" />
        <div class="source-card-inner">
          <span class="source-title">${escHtml(s.title)}</span>
          <span class="source-domain">${escHtml(s.domain)}</span>
        </div>
      </a>
    `).join('');

    return `
      <div>
        <p class="sources-label">Fontes</p>
        <div class="sources-strip">${cards}</div>
      </div>
    `;
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  /* ── Envia mensagem e faz streaming ────────────────────────── */
  async function sendMessage() {
    if (isStreaming) return;

    const input = document.getElementById('question-input');
    const question = input.value.trim();
    if (!question) return;

    input.value = '';
    input.style.height = 'auto';
    document.getElementById('send-btn').disabled = true;
    isStreaming = true;

    // Remove estado vazio
    const empty = document.getElementById('empty-state');
    if (empty) empty.remove();

    const history = document.getElementById('chat-history');

    // Bloco de mensagem
    const block = document.createElement('div');
    block.className = 'msg-block';
    block.innerHTML = `
      <div class="msg-user">${escHtml(question)}</div>
      <div class="msg-ai">
        <div class="ai-label">Resposta</div>
        <div class="loading-row" id="loading-row">
          <div class="spinner"></div>
          <span>${webEnabled ? 'Pesquisando na web…' : 'Pensando…'}</span>
        </div>
        <div id="sources-container"></div>
        <div class="answer-text streaming-cursor" id="answer-text"></div>
      </div>
    `;
    history.appendChild(block);
    block.scrollIntoView({ behavior: 'smooth', block: 'end' });

    const answerEl = block.querySelector('#answer-text');
    const sourcesEl = block.querySelector('#sources-container');
    const loadingEl = block.querySelector('#loading-row');

    let rawText = '';

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // guarda linha incompleta

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const jsonStr = line.slice(6).trim();
          if (!jsonStr) continue;

          let evt;
          try { evt = JSON.parse(jsonStr); } catch { continue; }

          if (evt.type === 'sources') {
            loadingEl.remove();
            if (evt.sources.length > 0) {
              sourcesEl.innerHTML = renderSources(evt.sources);
            }
          } else if (evt.type === 'chunk') {
            rawText += evt.text;
            answerEl.innerHTML = renderMarkdown(rawText);
            block.scrollIntoView({ behavior: 'smooth', block: 'end' });
          } else if (evt.type === 'done') {
            answerEl.classList.remove('streaming-cursor');
          } else if (evt.type === 'error') {
            answerEl.classList.remove('streaming-cursor');
            answerEl.innerHTML = `<span style="color:var(--danger)">⚠️ ${escHtml(evt.text)}</span>`;
          }
        }
      }

    } catch (err) {
      loadingEl.remove();
      answerEl.classList.remove('streaming-cursor');
      answerEl.innerHTML = `<span style="color:var(--danger)">⚠️ Erro de conexão: ${escHtml(err.message)}</span>`;
    } finally {
      isStreaming = false;
      document.getElementById('send-btn').disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
